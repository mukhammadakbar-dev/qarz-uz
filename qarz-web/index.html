<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- public/favicon.svg existed but was never linked, so browsers fell back
         to /favicon.ico and every page load logged a 404. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="description" content="TemirDaftar — do'konlar va shaxsiy foydalanuvchilar uchun qarzlarni hisobga olish tizimi. Qarzdorlar, to'lovlar, kunlik savdo va avtomatik eslatmalar." />
    <meta name="theme-color" content="#3b4cca" />

    <!-- Shown when a link is pasted into Telegram, which is how most users
         will first meet the site. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TemirDaftar — Qarzlarni boshqarish" />
    <meta property="og:description" content="Qarzdorlar, to'lovlar va kunlik savdoni bir joyda yuriting. Telegram bot bilan." />
    <!-- TODO: add og:image once a 1200x630 preview exists. src/assets/hero.png
         is 343x361 and unreferenced, so it is not a candidate. Without an image
         Telegram still renders a text card; with a wrongly-sized one it crops. -->
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet" />

    <!-- Official Telegram Mini App SDK. A no-op outside Telegram's WebView —
         it defines window.Telegram.WebApp only when actually launched from a
         bot's web_app button, so loading it unconditionally on every ordinary
         browser visit is harmless. Required by Telegram for any Mini App. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <title>TemirDaftar — Qarzlarni boshqarish</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
