# nginx config for the qarz-web container: serves the built SPA and forwards
# API traffic to the backend, so the browser only ever talks to one origin.
#
# That single-origin setup is why CORS_ORIGINS can stay tight: the API is
# reached at /api on the same host, not cross-origin.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are small JSON payloads; the backend caps bodies at 100kb anyway.
    client_max_body_size 1m;

    # The edge terminates TLS and sets these; nginx here just needs to pass
    # them along so the backend sees the real client address (its auth rate
    # limits are keyed on it).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API ----
    location /api/ {
        proxy_pass http://backend:4000;
    }

    # Click's webhooks and the public one-time payment pages are served by the
    # backend at the root, not under /api.
    location /pay/ {
        proxy_pass http://backend:4000;
    }
    location /webhooks/ {
        proxy_pass http://backend:4000;
    }

    location = /health {
        proxy_pass http://backend:4000;
        access_log off;
    }

    # ---- Static assets ----
    # Vite fingerprints these filenames, so a stale cache is impossible and the
    # response can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA ----
    # Every non-file path must return index.html: the routes (/debtors, /sales,
    # /super-admin/...) exist only in React Router, so a direct visit or a
    # refresh would otherwise 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a browser keeps loading the
    # old one and asking for asset filenames that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
