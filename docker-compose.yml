# Full stack: Postgres, the API, the Telegram bot, and the web SPA.
#
#   cp .env.production.example .env      # then fill in every secret
#   docker compose up -d --build
#   docker compose run --rm backend node src/db/migrate.js
#   docker compose run --rm backend node src/db/seed.js
#
# Only `web` publishes a port (127.0.0.1:8080). Put nginx or Caddy on the host
# in front of it for TLS — see deploy/nginx.conf.example.

name: qarz

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:?set DB_USER in .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
      POSTGRES_DB: "${DB_NAME:?set DB_NAME in .env}"
      # Postgres only applies these at initdb time, but they make `docker
      # compose exec db psql` and any pg_dump output predictable.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Nightly dumps land here; see deploy/backup.sh.
      - ./backups:/backups
    # Deliberately NOT published to the host: the database is reachable only
    # over the compose network. Use `docker compose exec db psql` for a shell.
    healthcheck:
      # -U/-d, otherwise pg_isready checks the "root" user and reports failure
      # while Postgres is in fact healthy.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./qarz-backend
    restart: unless-stopped
    depends_on:
      db:
        # Waits for the healthcheck above, not merely for the container to
        # exist — otherwise the API starts before Postgres accepts connections.
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Plaintext is fine here and only here: db is on a private compose
      # network with no published port. A managed database needs DB_SSL=true.
      DB_SSL: ${DB_SSL:-false}

      # Number of proxies that APPEND to X-Forwarded-For before a request
      # reaches the app. req.ip is read that many hops from the right, and the
      # auth rate limits are keyed on it — too low and every user shares one
      # bucket, too high and a client can spoof its address past the limits.
      #   2 = host nginx (TLS, deploy/nginx.conf.example) + the web container
      #   1 = web container only, e.g. TLS handled by a cloud load balancer
      TRUST_PROXY: ${TRUST_PROXY:-2}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}

      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?generate with: openssl rand -hex 32}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?generate with: openssl rand -hex 32}"
      PAYMENT_LINK_SECRET: "${PAYMENT_LINK_SECRET:?generate with: openssl rand -hex 32}"
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}

      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      DEFAULT_SMS_LIMIT: ${DEFAULT_SMS_LIMIT:-30}
      PAYMENT_LINK_TTL_HOURS: ${PAYMENT_LINK_TTL_HOURS:-48}

      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY}

      ESKIZ_EMAIL: ${ESKIZ_EMAIL}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      BOT_SHARED_SECRET: "${BOT_SHARED_SECRET:?generate with: openssl rand -hex 24}"

      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}

      # Optional. Empty = error reporting is off entirely, not merely silent.
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}

  bot:
    build:
      context: ./qarz-bot
    restart: unless-stopped
    depends_on:
      backend:
        # The bot loads every session from the backend before it accepts a
        # single update, and exits if that call fails — so it must not start
        # first. `restart: unless-stopped` covers the backend restarting later.
        condition: service_started
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?from @BotFather}"
      API_BASE_URL: http://backend:4000
      # MUST equal the backend's value — it is what unlocks the session store.
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET}
      DEFAULT_LANG: ${DEFAULT_LANG:-uz}
      # Long polling by default: no inbound port, no TLS certificate, nothing
      # to expose. Switch to webhooks only once traffic justifies it.
      USE_WEBHOOK: ${USE_WEBHOOK:-false}
      WEBHOOK_URL: ${WEBHOOK_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      PORT: 3001

      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}

  web:
    build:
      context: ./qarz-web
      args:
        # Empty = same-origin: the SPA calls /api on its own host and this
        # container's nginx proxies it to the backend. Baked in at build time,
        # so changing it requires a rebuild, not a restart.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Bound to loopback: the host's TLS proxy reaches it, the internet does
      # not. Dropping the 127.0.0.1 prefix would publish plain HTTP to the world
      # — and on most hosts punch straight through the firewall.
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
