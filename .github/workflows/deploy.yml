name: CD - Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            qarz-backend/package-lock.json
            qarz-bot/package-lock.json
            qarz-web/package-lock.json

      - name: Backend Test & Lint
        working-directory: qarz-backend
        run: |
          npm ci
          npm run lint
          npm test

      - name: Bot Test & Lint
        working-directory: qarz-bot
        run: |
          npm ci
          npm run lint
          npm test

      - name: Web Test & Build
        working-directory: qarz-web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  deploy:
    name: Deploy to Production Server
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            PROJECT_DIR="${{ secrets.SERVER_PROJECT_DIR }}"
            if [ -z "$PROJECT_DIR" ]; then
              if [ -d "/srv/qarz" ]; then PROJECT_DIR="/srv/qarz";
              elif [ -d "$HOME/qarz-uz" ]; then PROJECT_DIR="$HOME/qarz-uz";
              else PROJECT_DIR="$HOME/projects/qarz-uz"; fi
            fi
            cd "$PROJECT_DIR"
            ./deploy/deploy.sh
