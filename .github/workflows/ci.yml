name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test DB rollari va bazalari
        run: psql "postgres://postgres:postgres@localhost:55432/postgres" -v ON_ERROR_STOP=1 -f deploy/db/dev-init.sql

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Unit va Mini App komponent testlari (golden dataset tekshiruvi ham shu yerda)
        run: pnpm test
      - name: Integratsion testlar (real PostgreSQL)
        run: pnpm test:int
      - name: Build (server va Mini App)
        run: |
          pnpm --filter @nasiya/server build
          pnpm build:miniapp
