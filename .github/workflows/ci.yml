name: CI

on:
  # Naming feature branches here means every new one is forgotten until someone
  # notices CI never ran. main covers what is shipped; pull_request covers
  # everything on its way there, without running twice for a branch with an
  # open PR.
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per service rather than one big job: they are independent, so they
  # run in parallel and a failure names the service directly.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfiles. Bumping one without the other means CI
          # stops testing what production actually runs.
          node-version: 22
          cache: npm
          cache-dependency-path: qarz-backend/package-lock.json

      - name: Install
        working-directory: qarz-backend
        # `ci`, not `install`: fails on a lockfile that has drifted from
        # package.json instead of quietly resolving new versions.
        run: npm ci

      - name: Lint
        working-directory: qarz-backend
        run: npm run lint

      - name: Test
        working-directory: qarz-backend
        # No database service needed: the suites stub pg.Pool.
        run: npm test

  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qarz-bot/package-lock.json

      - name: Install
        working-directory: qarz-bot
        run: npm ci

      - name: Lint
        working-directory: qarz-bot
        run: npm run lint

      - name: Test
        working-directory: qarz-bot
        run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qarz-web/package-lock.json

      - name: Install
        working-directory: qarz-web
        run: npm ci

      - name: Lint
        working-directory: qarz-web
        run: npm run lint

      - name: Build
        working-directory: qarz-web
        # There are no web tests yet, so the build IS the check: it catches
        # missing imports and syntax errors, which is what removing a page or
        # a component usually breaks.
        run: npm run build

  # Proves the images still build. Without this, a Dockerfile can rot for weeks
  # and only fail during a deploy, which is the worst possible time to find out.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./qarz-backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build bot image
        uses: docker/build-push-action@v6
        with:
          context: ./qarz-bot
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./qarz-web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
